services:
  # NETS Go Backend REST API
  - type: web
    name: nets-publichtml-wj46
    runtime: go
    rootDir: backend
    buildCommand: go build -o server main.go
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: APP_NAME
        value: NETS Logistics REST API
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

  # NETS Frontend Single Page Application
  - type: web
    name: nets-logistics-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nets-publichtml-wj46.onrender.com/api/v1

